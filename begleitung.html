<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b1712">
<title>Begleitung</title>
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Begleitung: live begleiten mit weiter/zurück. Dunkel, damit das Display im Kirchenraum nicht blendet. */
:root {
    --grund: #1b1712; --flaeche: #2a241c; --linie: #4a4034;
    --text: #f3e9da; --leise: #b3a48e; --warm: #e8a64a; --warm-tief: #8a5a1c;
    --fokus: #ffd25a;
    color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
    background: var(--grund); color: var(--text);
    font: 20px/1.3 -apple-system, system-ui, sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top, 0) max(12px, env(safe-area-inset-right, 0)) env(safe-area-inset-bottom, 0) max(12px, env(safe-area-inset-left, 0));
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: manipulation;
}
button, input, select { font: inherit; color: inherit; }
button {
    background: var(--flaeche); border: 2px solid var(--linie); border-radius: 14px;
    min-height: 52px; padding: 6px 14px; cursor: pointer;
}
button:focus-visible, input:focus-visible, select:focus-visible { outline: 4px solid var(--fokus); outline-offset: 3px; }
button[aria-pressed="true"] { background: var(--warm-tief); border-color: var(--warm); }

/* Handy hochkant (@dd 20261105): oben eine Zeile Kopf mit Tempo und Zustand, darunter Akkord und Text knapp,
   dann so viele Pads wie Platz ist, unten die Tasten */
header { display: flex; gap: 8px; align-items: center; padding-block: 6px; flex: none; }
header h1 { font-size: 22px; margin: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#status { display: flex; gap: 8px; align-items: center; font-size: 18px; margin-right: auto; min-width: 0; }
#tempoAnz { color: var(--leise); white-space: nowrap; }
#zustand { padding: 4px 10px; border-radius: 10px; background: var(--flaeche); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#zustand[data-art="laeuft"] { background: #2f4a2a; }
#zustand[data-art="nachhut"] { background: #5a3a1a; }
.rund { width: 48px; min-height: 48px; padding: 0; border-radius: 50%; font-size: 22px; font-weight: 700; flex: none; }

#anzeige { flex: none; display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 14px; align-items: end; padding-block: 4px 8px; }
#akkord { grid-row: 1 / 3; font-size: clamp(44px, min(14vw, 9vh), 96px); font-weight: 800; color: var(--warm); line-height: 1; min-width: 1.6em; }
#wo { font-size: 16px; color: var(--leise); }
#jetzt { font-size: clamp(20px, min(5.5vw, 4vh), 36px); font-weight: 600; line-height: 1.15; min-height: 1.15em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#dann { grid-column: 1 / -1; font-size: clamp(16px, min(4.2vw, 3vh), 26px); color: var(--leise); min-height: 1.3em; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#dann b { color: var(--text); font-weight: 600; }
#dann .ak { color: var(--warm); }

/* Pads: alle Tippstellen als Feld, füllt den freien Platz, scrollt senkrecht */
#streifen { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
    grid-auto-rows: minmax(52px, 1fr); gap: 6px; padding-block: 4px; scrollbar-width: none; }
#streifen button { min-height: 52px; padding: 4px 6px; touch-action: pan-y; -webkit-touch-callout: none; font-size: 17px; line-height: 1.15;
    overflow: hidden; text-align: left; color: #857865; border-radius: 12px; }
#streifen button .t { display: block; font-size: 13px; color: var(--leise); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#streifen button .w { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#streifen button.an { background: var(--warm-tief); border-color: var(--warm); color: #d9bd94; }
/* Wort: Tippsilbe kräftig, der Rest des Wortes zurückgenommen, auch auf der aktiven Stelle */
#streifen button b { color: var(--text); font-weight: 800; font-size: 1.12em; }
#streifen button.an b { color: #fff; }
#streifen button.an .t { color: #f3dcb8; }

/* Tasten: A klein, Stopp daneben, weiter breit; nie breiter als der Bildschirm */
#tasten { flex: none; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 2.6fr); gap: 8px;
    height: 16vh; min-height: 96px; padding-block: 6px 8px; }
#aKnopf { font-size: 30px; font-weight: 700; }
#stoppKnopf { font-size: 20px; line-height: 1.1; }
#weiter { font-size: clamp(28px, 9vw, 46px); font-weight: 700; background: #3a2c18; border-color: var(--warm); }
#weiter:active, #weiter.druck { background: var(--warm-tief); }

/* Quer (Handy liegt): Anzeige und Pads links, Tasten rechts über die volle Höhe */
@media (orientation: landscape) and (max-height: 600px) {
    body { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); grid-template-rows: auto auto 1fr; column-gap: 12px; }
    header { grid-column: 1 / -1; }
    #anzeige { grid-column: 1; grid-row: 2; }
    #streifen { grid-column: 1; grid-row: 3; }
    #tasten { grid-column: 2; grid-row: 2 / 4; height: auto; min-height: 0; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: 1fr 2fr; }
    #weiter { grid-column: 1 / -1; }
}

/* Tablet hochkant und größer: Pads größer, sie wachsen in den freien Platz (Zeilen 1fr) */
@media (min-width: 700px) and (min-height: 601px) {
    #streifen { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); grid-auto-rows: minmax(68px, 1fr); gap: 10px; }
    #streifen button { font-size: 22px; padding: 6px 10px; }
    #streifen button .t { font-size: 16px; }
    #tasten { height: 14vh; }
    #aKnopf { font-size: 40px; }
    #stoppKnopf { font-size: 24px; }
}

/* Große Bildschirme (Tablet quer, Rechner): links Anzeige groß und Pads, rechts die Tasten untereinander */
@media (min-width: 900px) and (min-height: 601px) {
    body { display: grid; grid-template-columns: minmax(0, 1fr) clamp(280px, 28vw, 420px); grid-template-rows: auto auto 1fr;
        column-gap: 20px; max-width: 1800px; margin-inline: auto; }
    header { grid-column: 1 / -1; padding-block: 10px; }
    header h1 { font-size: 28px; }
    #status { font-size: 22px; }
    #anzeige { grid-column: 1; grid-row: 2; padding-block: 8px 14px; }
    #akkord { font-size: clamp(80px, 11vh, 150px); }
    #wo { font-size: 20px; }
    #jetzt { font-size: clamp(30px, 4.5vh, 52px); }
    #dann { font-size: clamp(22px, 3vh, 34px); }
    #streifen { grid-column: 1; grid-row: 3; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); grid-auto-rows: minmax(72px, 1fr); }
    #streifen button { font-size: clamp(22px, 2.6vh, 30px); }
    #streifen button .t { font-size: clamp(15px, 1.8vh, 20px); }
    #tasten { grid-column: 2; grid-row: 2 / 4; height: auto; min-height: 0; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        grid-template-rows: minmax(110px, 1fr) 3fr; gap: 12px; padding-block: 8px 16px; }
    #weiter { grid-column: 1 / -1; font-size: clamp(44px, 5vw, 80px); }
    #aKnopf { font-size: 44px; }
    #stoppKnopf { font-size: 26px; }
}

#einstellungen {
    position: fixed; inset: auto 0 0 0; background: var(--flaeche); border-top: 2px solid var(--linie);
    padding: 16px max(16px, env(safe-area-inset-right, 0)) calc(16px + env(safe-area-inset-bottom, 0)) max(16px, env(safe-area-inset-left, 0));
    display: grid; gap: 10px; max-height: 80vh; overflow-y: auto; z-index: 5;
}
#einstellungen label { display: grid; grid-template-columns: 7.5em 1fr 3.2em; align-items: center; gap: 10px; min-height: 52px; }
#einstellungen label.haken { grid-template-columns: 52px 1fr; }
#einstellungen output { text-align: right; color: var(--leise); }
input[type=range] { width: 100%; height: 52px; accent-color: var(--warm); }
input[type=checkbox] { width: 32px; height: 32px; accent-color: var(--warm); }
#einstellungen .zeile { display: flex; gap: 10px; flex-wrap: wrap; }
#einstellungen .zeile button { flex: 1; }

/* Hilfemodus (Standard @dd): Ringe um erklärbare Elemente, Klick zeigt Hilfe statt Funktion */
body.hilfemodus [data-hilfe] { outline: 3px dashed var(--fokus); outline-offset: 3px; transition: outline-color .2s; }
body.hilfemodus [data-hilfe]:hover { outline-style: solid; }
#hilfeKnopf[aria-pressed="true"] { background: var(--fokus); color: #000; border-color: var(--fokus); }
#blase {
    position: fixed; z-index: 10; max-width: min(26em, calc(100vw - 24px)); background: #fff7e0; color: #1b1712;
    border-radius: 12px; padding: 12px 16px; font-size: 18px; box-shadow: 0 6px 24px #0008;
}
#meldung { position: fixed; left: 50%; top: 40%; transform: translateX(-50%); background: #000c; padding: 14px 20px; border-radius: 12px; z-index: 8; }
</style>
</head>
<body>
<header>
    <h1 id="titel">Begleitung</h1>
    <div id="status" data-hilfe="Tempo, wie es aus deinen Tipps gemittelt wird, und der Zustand: bereit, hört hin (nach dem ersten Tipp, der zweite gibt das Metrum), läuft, wartet kurz (dein Tipp fehlt noch), Nachhut (Tipp fehlte, die Begleitung blendet aus), wartet auf Tipp (Wartestelle), ja weiter (Tipp viel zu früh), Ende.">
        <span id="tempoAnz">♩</span><span id="zustand">bereit</span>
    </div>
    <button id="zahnrad" class="rund" aria-label="Einstellungen" data-hilfe="Tippen (deine Stellen oder jeder Takt), Klang, Lautstärke, Tiefbass, Wärme, Anfangstempo, Box wach halten, von vorn.">⚙</button>
    <button id="hilfeKnopf" class="rund" aria-pressed="false" aria-label="Hilfe">?</button>
</header>

<main id="anzeige" data-hilfe="Akkord, der gerade klingt, daneben die Stelle und ihr Text, darunter die nächste Stelle.">
    <div id="wo"><span id="stelle"></span></div>
    <div id="akkord"></div>
    <div id="jetzt"></div>
    <div id="dann"></div>
</main>

<div id="streifen" data-hilfe="Pads: alle Tippstellen, oben Stelle und Akkord, darunter das Wort, die Tippsilbe fett. Gedrückt halten: der Akkord dort klingt, solange der Finger liegt. Loslassen: die Begleitung steht auf dieser Stelle, weiter startet von hier."></div>

<div id="tasten">
    <button id="aKnopf" aria-pressed="false" data-hilfe="Stopp: alles hört auf, die Begleitung steht wieder am Anfang (Seele). Solange A gedrückt ist, klingt leise der Stimmton a, loslassen: Ton aus. Tastatur: a halten.">A</button>
    <button id="stoppKnopf" data-hilfe="Stopp: der Klang klingt kurz aus, die Begleitung bleibt an der Stelle. weiter startet von dort neu (mit Hinhören). Tastatur: Leertaste startet und stoppt.">■<br>Stopp</button>
    <button id="weiter" data-hilfe="Erster Tipp auf Seele (2:1) startet, der zweite auf fangen (3:1) gibt das Tempo. Danach je nach Einstellung auf deine Stellen oder auf jede Eins (der Streifen zeigt, welche). Alles dazwischen kommt von selbst im Tipp-Tempo. Fehlt ein Tipp, wartet die Begleitung kurz, dann kommt die Stelle weich und blendet aus. Leertaste: Start und Stopp. Fußtaster: Pfeil rechts, Bild runter. Ein Tipp viel zu früh heißt nur: ja, weiter.">weiter</button>
</div>

<section id="einstellungen" hidden aria-label="Einstellungen">
    <div id="moduswahl" class="zeile" data-hilfe="Wo getippt wird. Deine Stellen: Seele 2:1, fangen 3:1, Kerker 4:4, 6:1, 8:1, 9:1, 10:3, 11:3, 13:1, 14:1, ab Takt 15 jeder Takt. Jeder Takt: ab Takt 2 auf jede Eins. Umschalten stellt auf den Anfang."></div>
    <div id="klangwahl" class="zeile" data-hilfe="Klangfarbe. Orgel: Flötenregister, klarer Einsatz. Fläche: weicher Synthesizer-Teppich, setzt langsamer ein."></div>
    <label data-hilfe="Gesamtlautstärke der Begleitung.">Lautstärke <input id="lautstaerke" type="range" min="0" max="100"><output></output></label>
    <label data-hilfe="Zusätzlicher Bass eine Oktave unter der tiefsten Stimme. Draußen braucht es mehr, in der Kirche weniger.">Tiefbass <input id="tiefbass" type="range" min="0" max="100"><output></output></label>
    <label data-hilfe="Weiter links dunkler und weicher, weiter rechts heller und deutlicher.">Wärme <input id="waerme" type="range" min="0" max="100"><output></output></label>
    <label data-hilfe="Tempo, mit dem die Uhr beim ersten Tipp anfängt. Danach führen deine Tipps das Tempo.">Anfang ♩ <input id="tempo" type="range" min="50" max="130"><output></output></label>
    <label class="haken" data-hilfe="Spielt einen unhörbar leisen Dauerton, damit eine Bluetooth-Box nach Stille nicht einschläft und den weichen Einsatz verschluckt."><input id="wach" type="checkbox"> Box wach halten</label>
    <div class="zeile">
        <button id="vonVorn" data-hilfe="Zurück an den Anfang, ohne etwas zu spielen.">von vorn</button>
        <button id="zu">fertig</button>
    </div>
</section>

<div id="blase" hidden></div>
<div id="meldung" hidden></div>
<script src="begleitung.js"></script>
</body>
</html>
