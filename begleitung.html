<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b1712">
<title>Begleitung</title>
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Begleitung: live begleiten mit weiter/zurück. Dunkel, damit das Display im Kirchenraum nicht blendet. */
:root {
    --grund: #1b1712; --flaeche: #2a241c; --linie: #4a4034;
    --text: #f3e9da; --leise: #b3a48e; --warm: #e8a64a; --warm-tief: #8a5a1c;
    --fokus: #ffd25a;
    color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
    background: var(--grund); color: var(--text);
    font: 20px/1.3 -apple-system, system-ui, sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top, 0) max(12px, env(safe-area-inset-right, 0)) env(safe-area-inset-bottom, 0) max(12px, env(safe-area-inset-left, 0));
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: manipulation;
}
button, input, select { font: inherit; color: inherit; }
button {
    background: var(--flaeche); border: 2px solid var(--linie); border-radius: 14px;
    min-height: 52px; padding: 6px 14px; cursor: pointer;
}
button:focus-visible, input:focus-visible, select:focus-visible { outline: 4px solid var(--fokus); outline-offset: 3px; }
button[aria-pressed="true"] { background: var(--warm-tief); border-color: var(--warm); }

header { display: flex; gap: 8px; align-items: center; padding-block: 8px; }
header h1 { font-size: 22px; margin: 0 auto 0 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rund { width: 52px; padding: 0; border-radius: 50%; font-size: 24px; font-weight: 700; flex: none; }

#status { display: flex; gap: 16px; align-items: center; font-size: 20px; padding-bottom: 4px; }
#tempoAnz { color: var(--leise); min-width: 4em; }
#zustand { padding: 4px 12px; border-radius: 10px; background: var(--flaeche); }
#zustand[data-art="laeuft"] { background: #2f4a2a; }
#zustand[data-art="nachhut"] { background: #5a3a1a; }
#akkord { font-size: clamp(48px, min(16vw, 12vh), 110px); font-weight: 800; color: var(--warm); line-height: 1; min-height: 1em; }

#anzeige { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; min-height: 0; padding-block: 6px; }
#wo { font-size: 18px; color: var(--leise); display: flex; justify-content: space-between; }
#jetzt { font-size: clamp(26px, 6vw, 44px); font-weight: 600; line-height: 1.15; margin: 6px 0; min-height: 1.15em; }
#dann { font-size: clamp(20px, 4.5vw, 32px); color: var(--leise); min-height: 1.3em; }
#dann b { color: var(--text); font-weight: 600; }
#dann .ak { color: var(--warm); }

#streifen { display: flex; gap: 6px; overflow-x: auto; padding-block: 6px; scrollbar-width: none; }
#streifen button { flex: none; min-height: 48px; font-size: 16px; max-width: 9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#streifen button .t { color: var(--leise); margin-right: 4px; }
#streifen button.an { background: var(--warm-tief); border-color: var(--warm); }

#tasten { display: grid; grid-template-columns: 1fr 3fr; grid-template-rows: 1fr 1fr; gap: 10px; height: 42vh; min-height: 180px; padding-block: 8px 10px; }
#zurueck { font-size: 26px; grid-column: 1; grid-row: 2; }
#aKnopf { font-size: 40px; font-weight: 700; grid-column: 1; grid-row: 1; }
#weiter { grid-column: 2; grid-row: 1 / 3; }
#weiter { font-size: 48px; font-weight: 700; background: #3a2c18; border-color: var(--warm); }
#weiter:active, #weiter.druck { background: var(--warm-tief); }

header, #status, #streifen, #tasten { flex: none; }
#anzeige { overflow: hidden; }
#jetzt { font-size: clamp(22px, min(6vw, 5vh), 44px); }
#dann { font-size: clamp(18px, min(4.5vw, 4vh), 32px); }

/* Quer (Handy liegt): Text links, Tasten rechts über die volle Höhe */
@media (orientation: landscape) and (max-height: 600px) {
    body { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto 1fr auto; column-gap: 12px; }
    header, #status { grid-column: 1 / -1; }
    #anzeige { grid-column: 1; grid-row: 3; }
    #streifen { grid-column: 1; grid-row: 4; }
    #tasten { grid-column: 2; grid-row: 3 / 5; height: auto; min-height: 0; grid-template-columns: 1fr 2fr; }
}

#einstellungen {
    position: fixed; inset: auto 0 0 0; background: var(--flaeche); border-top: 2px solid var(--linie);
    padding: 16px max(16px, env(safe-area-inset-right, 0)) calc(16px + env(safe-area-inset-bottom, 0)) max(16px, env(safe-area-inset-left, 0));
    display: grid; gap: 10px; max-height: 80vh; overflow-y: auto; z-index: 5;
}
#einstellungen label { display: grid; grid-template-columns: 7.5em 1fr 3.2em; align-items: center; gap: 10px; min-height: 52px; }
#einstellungen label.haken { grid-template-columns: 52px 1fr; }
#einstellungen output { text-align: right; color: var(--leise); }
input[type=range] { width: 100%; height: 52px; accent-color: var(--warm); }
input[type=checkbox] { width: 32px; height: 32px; accent-color: var(--warm); }
#einstellungen .zeile { display: flex; gap: 10px; flex-wrap: wrap; }
#einstellungen .zeile button { flex: 1; }

/* Hilfemodus (Standard @dd): Ringe um erklärbare Elemente, Klick zeigt Hilfe statt Funktion */
body.hilfemodus [data-hilfe] { outline: 3px dashed var(--fokus); outline-offset: 3px; transition: outline-color .2s; }
body.hilfemodus [data-hilfe]:hover { outline-style: solid; }
#hilfeKnopf[aria-pressed="true"] { background: var(--fokus); color: #000; border-color: var(--fokus); }
#blase {
    position: fixed; z-index: 10; max-width: min(26em, calc(100vw - 24px)); background: #fff7e0; color: #1b1712;
    border-radius: 12px; padding: 12px 16px; font-size: 18px; box-shadow: 0 6px 24px #0008;
}
#meldung { position: fixed; left: 50%; top: 40%; transform: translateX(-50%); background: #000c; padding: 14px 20px; border-radius: 12px; z-index: 8; }
</style>
</head>
<body>
<header>
    <h1 id="titel">Begleitung</h1>
    <button id="ausKnopf" data-hilfe="Beendet: der Klang klingt langsam aus (auch Esc). Der nächste Tipp stellt auf den Anfang.">Aus</button>
    <button id="zahnrad" class="rund" aria-label="Einstellungen" data-hilfe="Klang, Lautstärke, Tiefbass, Wärme, Anfangstempo, Box wach halten, von vorn.">⚙</button>
    <button id="hilfeKnopf" class="rund" aria-pressed="false" aria-label="Hilfe">?</button>
</header>

<div id="status" data-hilfe="Tempo, wie es aus deinen Tipps gemittelt wird, und der Zustand: bereit, läuft, wartet auf Tipp (Wartestelle), Nachhut (ein Tipp fehlte, die Begleitung blendet aus, bis der nächste Tipp im Takt kommt), ja weiter (Tipp viel zu früh, zählt als Bestätigung).">
    <span id="tempoAnz">♩</span><span id="zustand">bereit</span>
</div>

<main id="anzeige" data-hilfe="Takt, Akkord, der gerade klingt, darunter der Text dieses Taktes und was im nächsten Takt kommt.">
    <div id="wo"><span id="stelle"></span></div>
    <div id="akkord"></div>
    <div id="jetzt"></div>
    <div id="dann"></div>
</main>

<div id="streifen" data-hilfe="Alle Takte mit ihren Akkorden. Antippen springt dorthin, der Akkord klingt, der nächste Tipp startet von dieser Stelle."></div>

<div id="tasten">
    <button id="aKnopf" aria-pressed="false" data-hilfe="Stopp: alles hört auf, die Begleitung steht wieder am Anfang (Seele). Solange A gedrückt ist, klingt leise der Stimmton a, loslassen: Ton aus. Tastatur: a halten.">A</button>
    <button id="zurueck" data-hilfe="An den Anfang des Taktes, kurz nach dem Taktanfang einen Takt davor. Dort wartet die Begleitung auf den nächsten Tipp. Tastatur: Pfeil links, Bild hoch.">◀<br>zurück</button>
    <button id="weiter" data-hilfe="Erster Tipp auf Seele (2:1) startet, der zweite auf fangen (3:1) gibt das Tempo. Danach je nach Einstellung auf deine Stellen oder auf jede Eins (der Streifen zeigt, welche). Alles dazwischen kommt von selbst im Tipp-Tempo. Fehlt ein Tipp, wartet die Begleitung kurz, dann kommt die Stelle weich und blendet aus. Leertaste: Start und Stopp. Fußtaster: Pfeil rechts, Bild runter. Ein Tipp viel zu früh heißt nur: ja, weiter. Tastatur und Fußtaster: Leertaste, Pfeil rechts, Bild runter.">weiter</button>
</div>

<section id="einstellungen" hidden aria-label="Einstellungen">
    <div id="moduswahl" class="zeile" data-hilfe="Wo getippt wird. Deine Stellen: Seele 2:1, fangen 3:1, Kerker 4:4, 6:1, 8:1, 9:1, 10:3, 11:3, 13:1, 14:1, ab Takt 15 jeder Takt. Jeder Takt: ab Takt 2 auf jede Eins. Umschalten stellt auf den Anfang."></div>
    <div id="klangwahl" class="zeile" data-hilfe="Klangfarbe. Orgel: Flötenregister, klarer Einsatz. Fläche: weicher Synthesizer-Teppich, setzt langsamer ein."></div>
    <label data-hilfe="Gesamtlautstärke der Begleitung.">Lautstärke <input id="lautstaerke" type="range" min="0" max="100"><output></output></label>
    <label data-hilfe="Zusätzlicher Bass eine Oktave unter der tiefsten Stimme. Draußen braucht es mehr, in der Kirche weniger.">Tiefbass <input id="tiefbass" type="range" min="0" max="100"><output></output></label>
    <label data-hilfe="Weiter links dunkler und weicher, weiter rechts heller und deutlicher.">Wärme <input id="waerme" type="range" min="0" max="100"><output></output></label>
    <label data-hilfe="Tempo, mit dem die Uhr beim ersten Tipp anfängt. Danach führen deine Tipps das Tempo.">Anfang ♩ <input id="tempo" type="range" min="50" max="130"><output></output></label>
    <label class="haken" data-hilfe="Spielt einen unhörbar leisen Dauerton, damit eine Bluetooth-Box nach Stille nicht einschläft und den weichen Einsatz verschluckt."><input id="wach" type="checkbox"> Box wach halten</label>
    <div class="zeile">
        <button id="vonVorn" data-hilfe="Zurück an den Anfang, ohne etwas zu spielen.">von vorn</button>
        <button id="zu">fertig</button>
    </div>
</section>

<div id="blase" hidden></div>
<div id="meldung" hidden></div>
<script src="begleitung.js"></script>
</body>
</html>
