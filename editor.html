<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1712">
<title>Ablauf-Editor</title>
<link rel="icon" href="favicon-32.png">
<style>
/* Ablauf-Editor: Tippstellen und Raster für die Begleitung „Bereit“ setzen. Farben wie begleitung.html. */
:root {
    --grund: #1b1712; --flaeche: #2a241c; --linie: #4a4034;
    --text: #f3e9da; --leise: #b3a48e; --warm: #e8a64a; --warm-tief: #8a5a1c;
    --fokus: #ffd25a; --gruen: #7fc46a;
    color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
    background: var(--grund); color: var(--text);
    font: 20px/1.3 -apple-system, system-ui, sans-serif;
    padding: env(safe-area-inset-top, 0) max(12px, env(safe-area-inset-right, 0)) 40vh max(12px, env(safe-area-inset-left, 0));
}
button, input { font: inherit; color: inherit; }
button {
    background: var(--flaeche); border: 2px solid var(--linie); border-radius: 14px;
    min-height: 52px; padding: 6px 14px; cursor: pointer;
}
input {
    background: var(--grund); border: 2px solid var(--linie); border-radius: 12px; min-height: 52px; padding: 6px 12px; width: 6em;
}
button:focus-visible, input:focus-visible { outline: 4px solid var(--fokus); outline-offset: 3px; }
button[aria-pressed="true"] { background: var(--warm-tief); border-color: var(--warm); }
.rund { width: 52px; padding: 0; border-radius: 50%; font-size: 24px; font-weight: 700; flex: none; }

/* Leiste oben bleibt stehen */
#leiste {
    position: sticky; top: 0; z-index: 6; background: var(--grund); border-bottom: 2px solid var(--linie);
    display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding-block: 10px;
}
#leiste h1 { font-size: 24px; margin: 0; }
#leiste label { display: flex; align-items: center; gap: 8px; color: var(--leise); }
#leiste .gruppe { display: flex; align-items: center; gap: 8px; }
#raster button { min-width: 64px; }
#speichern { font-weight: 700; background: #3a2c18; border-color: var(--warm); margin-left: auto; }
#speichern.schmutz::after { content: " ●"; color: var(--warm); }
#speichern:disabled { opacity: .6; cursor: wait; }
#ohne { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-block: 8px; color: var(--leise); font-size: 17px; }
#ohne button { min-height: 44px; font-size: 17px; }

/* Takte */
#takte { display: grid; gap: 14px; padding-block: 14px; }
.takt { background: var(--flaeche); border: 2px solid var(--linie); border-radius: 14px; overflow-x: auto; padding: 8px 10px 10px; }
.takt h2 { margin: 0 0 6px; font-size: 20px; color: var(--leise); display: flex; gap: 12px; align-items: baseline; }
.takt h2 b { color: var(--warm); font-size: 26px; }
.takt h2 .marke { font-size: 16px; color: var(--gruen); }
.gitter { position: relative; display: grid; align-items: stretch; row-gap: 4px; min-width: calc(2em + var(--n) * 70px); }
.gitter .kuerzel { grid-column: 1; color: var(--leise); font-weight: 700; align-self: center; position: sticky; left: 0; background: var(--flaeche); z-index: 2; }
.silbe { min-height: 56px; padding: 4px 8px; font-size: 22px; text-align: left; border-radius: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--grund); }
.silbe.an { background: var(--warm-tief); border-color: var(--fokus); border-width: 3px; font-weight: 800; color: #fff; }
.silbe.vorAnfang.an { background: #3a3630; border-color: #8a8070; color: #bdb2a0; }
.silbe.anfangsort { box-shadow: inset 5px 0 0 var(--gruen); }
.silbe .st { display: block; font-size: 13px; color: var(--leise); font-weight: 400; line-height: 1; }
.silbe.an .st { color: #f3dcb8; }
.akk { font-size: 22px; font-weight: 800; color: var(--warm); align-self: center; padding-inline: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-left: 2px solid var(--linie); }
.raster { border-left: 3px dashed var(--gruen); pointer-events: none; z-index: 3; opacity: .85; }
.leer { color: var(--linie); align-self: center; padding-inline: 8px; }

/* Hilfemodus wie in begleitung.html */
body.hilfemodus [data-hilfe] { outline: 3px dashed var(--fokus); outline-offset: 3px; transition: outline-color .2s; }
body.hilfemodus [data-hilfe]:hover { outline-style: solid; }
#hilfeKnopf[aria-pressed="true"] { background: var(--fokus); color: #000; border-color: var(--fokus); }
#blase {
    position: fixed; z-index: 10; max-width: min(26em, calc(100vw - 24px)); background: #fff7e0; color: #1b1712;
    border-radius: 12px; padding: 12px 16px; font-size: 18px; box-shadow: 0 6px 24px #0008;
}
#meldung { position: fixed; left: 50%; top: 40%; transform: translateX(-50%); background: #000d; padding: 16px 24px; border-radius: 12px; z-index: 8; max-width: calc(100vw - 32px); text-align: center; }
#meldung.fehler { background: #5a1a1a; border: 2px solid #e86a4a; }
#meldung small { display: block; color: var(--leise); font-size: 14px; margin-top: 6px; }
</style>
</head>
<body>
<div id="leiste">
    <h1 id="titel">Ablauf-Editor</h1>
    <div class="gruppe" data-hilfe="Anfang: die Stelle, an der die Begleitung bereitsteht (Takt:Schlag, z.B. 2:1). Tippstellen davor sind grau. Schneller: im Text mit gedrückter Wahltaste (Alt) auf eine Silbe klicken.">
        <label>Anfang <input id="anfang" inputmode="decimal" autocomplete="off" aria-label="Anfang, Takt:Schlag"></label>
    </div>
    <div class="gruppe" data-hilfe="Raster: ab diesem Takt ist auch ohne eigene Tippstelle alle 1 oder 2 Schläge eine Stelle (1/1 = jede Eins, 1/2 = Eins und Drei). Im Text als grün gestrichelte Linien. Leer lassen: kein Raster.">
        <label>Raster ab Takt <input id="rasterAb" inputmode="numeric" autocomplete="off" aria-label="Raster ab Takt"></label>
        <span id="raster" role="group" aria-label="Raster"><button data-s="4" aria-pressed="false" aria-label="jede Eins">1/1</button><button data-s="2" aria-pressed="false" aria-label="Eins und Drei">1/2</button></span>
    </div>
    <button id="speichern" data-hilfe="Speichert den Ablauf in die Datei neben dem Lied und legt einen Commit an. Der Punkt zeigt: es gibt ungespeicherte Änderungen. Läuft nur über den Hörseiten-Server am Mac.">Speichern</button>
    <button id="hilfeKnopf" class="rund" aria-pressed="false" aria-label="Hilfe">?</button>
</div>
<div id="ohne" hidden data-hilfe="Tippstellen, an denen im Text keine Silbe steht. Klick auf eine entfernt sie."></div>
<main id="takte" data-hilfe="Je Takt vier Zeilen (S A T B) mit den Silben an ihrer Stelle, darunter die Akkorde (nur Anzeige). Silbe antippen: wird Tippstelle mit dieser Stimme (fett, orange Rahmen). Nochmal antippen: weg. Steht dort schon eine Stelle einer anderen Stimme, wechselt nur die Stimme. Alt+Klick setzt den Anfang.">Lade …</main>
<div id="blase" hidden></div>
<div id="meldung" hidden role="status"></div>
<script src="editor.js"></script>
</body>
</html>
